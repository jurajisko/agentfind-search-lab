# Keeps the free-tier Supabase project AgentFind from being paused.
#
# Supabase pauses free projects after 7 days without activity. The Search Lab
# gets almost no traffic yet, so the database sees none, and a pause would also
# take down the register at agentfind.vercel.app, which reads the same project.
#
# One small read per day counts as activity. It uses the publishable key, which
# is already public in agentfind-benchmark/dist/profiles.js and can only read
# rows that are public on the site. No secret is needed or stored here.
#
# If the read fails, the job fails and GitHub emails the repository owner —
# which doubles as an alert that the database is down or paused.
#
# Note: GitHub disables scheduled workflows in public repositories after 60 days
# without any commit. If that happens, re-enable it in the Actions tab.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one public row
        env:
          SUPABASE_URL: https://vbrwzshvmwwymqqakvdr.supabase.co
          PUBLISHABLE_KEY: sb_publishable_dznPdDyX_GRjV1LH4pcOyg_91RWYXs8
        run: |
          status=$(curl -s -o response.json -w '%{http_code}' --max-time 30 \
            -H "apikey: $PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/company_profiles?select=slug&is_public=eq.true&limit=1")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase read failed with HTTP $status — the project may be paused or down."
            exit 1
          fi
          echo "Supabase is awake."
