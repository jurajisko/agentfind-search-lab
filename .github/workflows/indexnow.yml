# Tells the IndexNow engines (Bing and through it Copilot, Yandex, Seznam,
# Naver, Yep) which pages changed, right after Vercel finishes a production
# deployment, instead of waiting until they recrawl on their own.
#
# Vercel reports each deployment to GitHub as a deployment status; this runs on
# the successful production ones only. It builds the deployed commit and the
# previous successful production commit, and scripts/indexnow.mjs submits the
# pages whose HTML differs between the two. No state is stored: the Actions
# cache is not available to deployment_status events.
#
# The IndexNow key is public by design (served at /<key>.txt), so no secret is
# needed. If the submission fails, the job fails and GitHub emails the owner.
# A manual run (workflow_dispatch) submits every page.
name: IndexNow

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the deployed commit
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Build the previous production commit
        if: github.event_name == 'deployment_status'
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
          CURRENT_ID: ${{ github.event.deployment.id }}
          CURRENT_SHA: ${{ github.event.deployment.sha }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: |
          previous=''
          for row in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$(jq -rn --arg e "$ENVIRONMENT" '$e|@uri')&per_page=20" \
                         --jq ".[] | select(.id != $CURRENT_ID and .sha != \"$CURRENT_SHA\") | \"\(.id):\(.sha)\""); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/${row%%:*}/statuses?per_page=1" --jq '.[0].state')
            if [ "$state" = success ] || [ "$state" = inactive ]; then previous=${row#*:}; break; fi
          done
          if [ -z "$previous" ]; then echo "No previous production deployment: every page is submitted."; exit 0; fi
          echo "Previous production commit: $previous"
          git worktree add -q ../previous "$previous"
          (cd ../previous && npm run build)
          echo "PREVIOUS_DIST=$(cd ../previous && pwd)/dist" >> "$GITHUB_ENV"

      - name: Submit changed pages
        run: node scripts/indexnow.mjs ${PREVIOUS_DIST:+--previous "$PREVIOUS_DIST"}
